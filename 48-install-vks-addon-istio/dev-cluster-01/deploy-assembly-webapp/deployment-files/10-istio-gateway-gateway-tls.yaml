apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: istio-assembly-gateway
  namespace: istio-gateway
spec:
  gatewayClassName: istio
  # Request a specific LoadBalancer IP address
  addresses:
    - type: IPAddress
      value: 10.55.16.105
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: All
    - name: https
      hostname: dev-assembly-istio.platformlab.vcf
      protocol: HTTPS
      port: 443
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: assembly-tls
      allowedRoutes:
        namespaces:
          from: All
