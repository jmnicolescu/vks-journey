# Apply inside each VKS workload cluster as a cluster administrator.
# Change metadata.namespace if the application uses a different namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: labusers-view
  namespace: default
subjects:
  - kind: Group
    name: sso:LabUsers@vsphere.local
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: ClusterRole
  name: view
  apiGroup: rbac.authorization.k8s.io
