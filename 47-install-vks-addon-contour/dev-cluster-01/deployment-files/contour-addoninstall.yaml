apiVersion: addons.kubernetes.vmware.com/v1alpha1
kind: AddonInstall
metadata:
  name: contour-dev-cluster-01
  namespace: dev-namespace
spec:
  addonRef:
    name: contour
  addonConfigNameTemplate: dev-cluster-01-contour
  releaseFilter:
    ref:
      name: contour.kubernetes.vmware.com.1.33.4-vmware.1-vks.1
      namespace: vmware-system-vks-public
  clusters:
    - selector:
        matchLabels:
          cluster.x-k8s.io/cluster-name: dev-cluster-01
  crossNamespaceSelection: Blocked
  stopMatchingBehavior: Delete
