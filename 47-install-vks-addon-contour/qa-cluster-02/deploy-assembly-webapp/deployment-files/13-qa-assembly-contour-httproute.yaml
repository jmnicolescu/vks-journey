apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: assembly-httproute
  namespace: qa-assembly-contour
spec:
  parentRefs:
    - name: contour-gateway
      namespace: tanzu-system-ingress
      sectionName: https
  hostnames:
    - qa-assembly-contour.platformlab.vcf
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: assembly-service
          port: 8080
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: assembly-http-redirect
  namespace: qa-assembly-contour
spec:
  parentRefs:
    - name: contour-gateway
      namespace: tanzu-system-ingress
      sectionName: http
  hostnames:
    - qa-assembly-contour.platformlab.vcf
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
